<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pegasus Claims Processing Platform</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Pegasus Insurance Platform - Comprehensive policy and claims management system">
  <meta name="keywords" content="insurance, policies, claims, management, platform, workflow, processing, approval, payment">
  <meta name="author" content="Pegasus Insurance">

  <!-- Security headers -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="X-XSS-Protection" content="1; mode=block">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; img-src 'self' data: https:;">

  <!-- PWA support -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1976d2">

  <!-- Icons -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png">

  <!-- Preload critical resources -->
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
      background-color: #fafafa;
    }

    /* Loading spinner styles */
    .loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .app-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    .loading-text {
      font-size: 18px;
      font-weight: 300;
      letter-spacing: 1px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Hide loading screen when app loads */
    .app-loaded .app-loading {
      display: none;
    }

    /* Error fallback styles */
    .error-container {
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      text-align: center;
      font-family: 'Roboto', sans-serif;
    }

    .error-icon {
      color: #f44336;
      font-size: 48px;
      margin-bottom: 20px;
    }

    /* Claims workflow status colors */
    :root {
      --status-submitted: #2196f3;
      --status-review: #ff9800;
      --status-approved: #4caf50;
      --status-denied: #f44336;
      --status-payment: #9c27b0;
      --status-closed: #607d8b;
    }
  </style>
</head>
<body class="mat-typography">
  <!-- Loading screen shown until Angular app initializes -->
  <div class="app-loading" id="initial-loader">
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading Pegasus Platform...</div>
  </div>

  <!-- Loading screen shown while Angular boots -->
  <div id="initial-loading" class="loading-container">
    <div>
      <div class="loading-spinner"></div>
      <div class="loading-text">Loading Pegasus Claims Platform...</div>
    </div>
  </div>

  <!-- Angular application root -->
  <app-root>
    <!-- Fallback content if Angular fails to load -->
    <div class="error-container">
      <div class="error-icon"></div>
      <h2>Claims Platform Unavailable</h2>
      <p>The Pegasus Claims Processing Platform is temporarily unavailable.</p>
      <p>Please check your internet connection and try refreshing the page.</p>
      <button onclick="window.location.reload()" style="padding: 10px 20px; background: #1976d2; color: white; border: none; border-radius: 4px; cursor: pointer;">
        Refresh Page
      </button>
    </div>
  </app-root>

  <!-- Main Angular application root -->
  <peg-root>
    <!-- Fallback content for non-JS users -->
    <noscript>
      <div style="padding: 40px; text-align: center; font-family: sans-serif;">
        <h1>JavaScript Required</h1>
        <p>The Pegasus Insurance Platform requires JavaScript to function properly.</p>
        <p>Please enable JavaScript in your browser settings and refresh the page.</p>
      </div>
    </noscript>
  </peg-root>

  <!-- Environment configuration for runtime -->
  <script>
    window.pegasusConfig = {
      environment: 'development',
      apiBaseUrl: 'http://localhost:5000/api',
      version: '1.0.0',
      features: {
        enableAuditLogging: true,
        enableRealTimeUpdates: false,
        enableAdvancedReports: true
      }
    };
  </script>

  <!-- Remove loading screen once Angular is ready -->
  <script>
    // Hide loading screen once Angular component is loaded
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() {
        const loading = document.getElementById('initial-loading');
        if (loading) {
          loading.style.display = 'none';
        }
      }, 100);
    });

    // Global error handler for uncaught JavaScript errors
    window.addEventListener('error', function(e) {
      console.error('Application Error:', e.error);
      // Could send error to logging service here
    });
  </script>
</body>
</html>
