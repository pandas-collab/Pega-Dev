<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pegasus Claims Processing Platform</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Material Design Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <!-- Material Theme -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

  <!-- Progressive Web App meta tags -->
  <meta name="theme-color" content="#1976d2">
  <meta name="description" content="Insurance Claims Processing and Workflow Management Platform">
  <meta name="keywords" content="insurance, claims, workflow, processing, approval, payment">

  <!-- Security headers for insurance compliance -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; img-src 'self' data: https:;">

  <style>
    /* Loading spinner styles */
    .loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #e0e0e0;
      border-top: 4px solid #1976d2;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      margin-top: 20px;
      color: #666;
      font-family: 'Roboto', sans-serif;
      font-size: 16px;
    }

    /* Error fallback styles */
    .error-container {
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      text-align: center;
      font-family: 'Roboto', sans-serif;
    }

    .error-icon {
      color: #f44336;
      font-size: 48px;
      margin-bottom: 20px;
    }

    /* Claims workflow status colors */
    :root {
      --status-submitted: #2196f3;
      --status-review: #ff9800;
      --status-approved: #4caf50;
      --status-denied: #f44336;
      --status-payment: #9c27b0;
      --status-closed: #607d8b;
    }
  </style>
</head>
<body class="mat-typography">
  <!-- Loading screen shown while Angular boots -->
  <div id="initial-loading" class="loading-container">
    <div>
      <div class="loading-spinner"></div>
      <div class="loading-text">Loading Pegasus Claims Platform...</div>
    </div>
  </div>

  <!-- Angular application root -->
  <app-root>
    <!-- Fallback content if Angular fails to load -->
    <div class="error-container">
      <div class="error-icon"></div>
      <h2>Claims Platform Unavailable</h2>
      <p>The Pegasus Claims Processing Platform is temporarily unavailable.</p>
      <p>Please check your internet connection and try refreshing the page.</p>
      <button onclick="window.location.reload()" style="padding: 10px 20px; background: #1976d2; color: white; border: none; border-radius: 4px; cursor: pointer;">
        Refresh Page
      </button>
    </div>
  </app-root>

  <!-- Remove loading screen once Angular is ready -->
  <script>
    // Hide loading screen once Angular component is loaded
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() {
        const loading = document.getElementById('initial-loading');
        if (loading) {
          loading.style.display = 'none';
        }
      }, 100);
    });

    // Global error handler for uncaught JavaScript errors
    window.addEventListener('error', function(e) {
      console.error('Application Error:', e.error);
      // Could send error to logging service here
    });
  </script>
</body>
</html>
