<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pegasus Insurance Platform</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Pegasus Insurance Platform - Comprehensive policy and claims management system">
  <meta name="keywords" content="insurance, policies, claims, management, platform">
  <meta name="author" content="Pegasus Insurance">

  <!-- Security headers -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="X-XSS-Protection" content="1; mode=block">

  <!-- PWA support -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1976d2">

  <!-- Icons -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png">

  <!-- Preload critical resources -->
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- Loading styles to prevent FOUC -->
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
      background-color: #fafafa;
    }

    .app-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    .loading-text {
      font-size: 18px;
      font-weight: 300;
      letter-spacing: 1px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Hide loading screen when app loads */
    .app-loaded .app-loading {
      display: none;
    }
  </style>
</head>
<body>
  <!-- Loading screen shown until Angular app initializes -->
  <div class="app-loading" id="initial-loader">
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading Pegasus Platform...</div>
  </div>

  <!-- Main Angular application root -->
  <peg-root>
    <!-- Fallback content for non-JS users -->
    <noscript>
      <div style="padding: 40px; text-align: center; font-family: sans-serif;">
        <h1>JavaScript Required</h1>
        <p>The Pegasus Insurance Platform requires JavaScript to function properly.</p>
        <p>Please enable JavaScript in your browser settings and refresh the page.</p>
      </div>
    </noscript>
  </peg-root>

  <!-- Environment configuration for runtime -->
  <script>
    window.pegasusConfig = {
      environment: 'development',
      apiBaseUrl: 'http://localhost:5000/api',
      version: '1.0.0',
      features: {
        enableAuditLogging: true,
        enableRealTimeUpdates: false,
        enableAdvancedReports: true
      }
    };
  </script>
</body>
</html>
